name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: 'npm dist-tag for a staged snapshot (e.g. next, canary). Lowercase, no underscores, not a SemVer version or range.'
        required: true
        default: 'next'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Release gates run here, without id-token or the release-bot token, because the package
  # check installs the packed archive with freshly resolved dependencies and runs it.
  verification:
    uses: ./.github/workflows/verification.yml

  release:
    name: Release PR or stage package
    if: github.event_name == 'push'
    needs: verification
    runs-on: ubuntu-latest
    # Limited to main; the npm trusted publisher only accepts tokens from this environment.
    environment: npm-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.CHANGESET_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # No dependency cache in the release job, so a poisoned cache cannot reach a release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or stage package
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: 'changesets: Release'
          commit: 'release: version package'
          commitMode: github-api
          version: pnpm exec changeset version
          # When a merged release PR has consumed all changesets, this skips a version that is
          # already tagged `v<version>` or published, then builds, packs with pnpm and stages the
          # tarball with npm. Its `New tag:` output lets the action create the `v<version>` tag
          # and GitHub Release.
          publish: pnpm run ci:stage-release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_STAGE_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}

  snapshot:
    name: Stage snapshot
    if: github.event_name == 'workflow_dispatch'
    needs: verification
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with staged-publishing support
        run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - name: Version snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
        run: node scripts/prepare-npm-snapshot.mjs
      - name: Stage snapshot package
        env:
          NPM_STAGE_CREATE_GIT_TAGS: 'false'
          NPM_STAGE_TAG: ${{ inputs.snapshot_tag }}
          NPM_STAGE_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
        run: pnpm run ci:stage-release
