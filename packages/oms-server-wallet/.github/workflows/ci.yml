name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint + typecheck + test via the shared composite (runs `pnpm run lint`,
  # `pnpm run --if-present typecheck`, `pnpm run --if-present test`).
  ci:
    name: CI - lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: 0xPolygon/pipelines/.github/actions/ci@main

  # Publish-readiness: coverage thresholds, publint, and a packed archive installed into a
  # clean consumer with install scripts disabled.
  package:
    name: Coverage & package checks
    if: "!startsWith(github.head_ref, 'changeset-release/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - run: pnpm run check:exports
      - run: pnpm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-candidate
          path: .data/package/
          include-hidden-files: true
