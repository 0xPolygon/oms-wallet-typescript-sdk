name: Claude Code Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.user.login != 'dependabot[bot]' &&
        contains(github.event.comment.body, '@claude review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_GITHUB_ACTIONS }}
          model: "claude-opus-4-8"
          direct_prompt: |
            Review this pull request. Focus on:
            - Correctness of SDK behavior changes (wallet auth, signing, transactions, indexer)
            - Test coverage — every changed behavior should have a test
            - Public API changes reflected in API.md and type-tests
            - Explicit .js extensions in relative imports under src/
            - No new secrets or credential values committed
            - TypeScript types are sound; no unsafe casts beyond existing patterns
            Keep feedback constructive and specific. Reference file + line where applicable.
          use_sticky_comment: true
